<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haps Club — People Are Saying Things</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #292f71;
    --navy-deep: #1a1f4d;
    --navy-tint: #EEF0F8;
    --accent: #FF6B47;
    --accent-deep: #E54D2B;
    --accent-tint: #FFF1ED;
    --bg: #FAFAF7;
    --ink: #0F1117;
    --ink-3: #6B6F7A;
    --sans: 'Inter', -apple-system, system-ui, sans-serif;
    --serif: 'Instrument Serif', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #2a2a2a;
    font-family: var(--sans);
    padding: 30px 0 60px;
    min-height: 100vh;
  }
  .toolbar {
    max-width: 1100px;
    margin: 0 auto 30px;
    padding: 0 20px;
    color: #eee;
    text-align: center;
  }
  .toolbar h1 { font-family: var(--serif); font-size: 28px; font-weight: 400; margin-bottom: 6px; }
  .toolbar p { font-size: 14px; color: #aaa; line-height: 1.5; }
  .toolbar code { background: #444; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  .deck {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    padding: 0 20px;
  }
  .slide-wrapper {
    background: #1a1a1a;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  .slide-label {
    background: #333;
    color: #ccc;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .slide-label .num { color: var(--accent); }
  .slide {
    width: 100%;
    aspect-ratio: 9 / 16;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }
  .slide svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .deck { display: block; max-width: none; padding: 0; gap: 0; }
    .slide-wrapper { page-break-after: always; border-radius: 0; box-shadow: none; }
    .slide-label { display: none; }
    .slide { aspect-ratio: auto; width: 1080px; height: 1920px; }
  }
</style>
<style>
  .deck { display:flex; flex-wrap:wrap; gap:16px; padding:20px; background:#e8e8e8; }
  .slide-wrap { position:relative; width:270px; height:480px; overflow:hidden; border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,.18); }
  .slide-wrap svg { width:100%; height:100%; display:block; }
  .toolbar { background:#1a1f4d; color:#fff; padding:12px 20px; font-family:'Inter',sans-serif; font-size:13px; display:flex; gap:16px; align-items:center; }
  .toolbar a { color:#FF6B47; text-decoration:none; font-weight:600; }
</style>
</head>
