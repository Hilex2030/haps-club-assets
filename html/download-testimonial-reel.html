<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download — Haps Club Testimonial Reel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#1a1f4d; font-family:'Inter',sans-serif; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:24px; padding:40px 20px; box-sizing:border-box; }
  h1 { font-size:28px; font-weight:700; margin:0; color:#FAFAF7; }
  p { font-size:15px; color:#6B6F7A; margin:0; text-align:center; }
  #btn { background:#FF6B47; color:#fff; border:none; border-radius:50px; padding:18px 48px; font-size:18px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; }
  #btn:disabled { opacity:0.5; cursor:default; }
  #status { font-size:14px; color:#6B6F7A; min-height:24px; text-align:center; }
  #previews { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; max-width:900px; }
  .thumb { width:108px; height:192px; border-radius:8px; overflow:hidden; box-shadow:0 2px 12px rgba(0,0,0,.4); }
  .thumb canvas { width:100%; height:100%; display:block; }
</style>
</head>
<body>
<h1>Haps Club · Testimonial Reel</h1>
<p>Downloads 6 slides as 1080×1920 PNGs.</p>
<div id="previews"></div>
<div id="status">Ready.</div>
<button id="btn" onclick="downloadAll()">⬇ Download All PNGs</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const DECK_URL = 'https://hilex2030.github.io/haps-club-assets/html/reel-testimonial.html';
const SLIDE_LABELS = [
  '01-open', '02-quote-digging', '03-quote-great-info',
  '04-quote-rad', '05-quote-so-good', '06-close'
];

async function getSVGs() {
  const resp = await fetch(DECK_URL);
  const html = await resp.text();
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  const wraps = doc.querySelectorAll('.slide-wrap');
  return Array.from(wraps).map(w => {
    const svg = w.querySelector('svg');
    // inline defs from hidden master svg
    return svg ? svg.outerHTML : null;
  }).filter(Boolean);
}

const FONT_CSS = `@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap');`;

async function svgToPng(svgStr) {
  const wrapped = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
    <defs><style>${FONT_CSS}</style></defs>
    ${svgStr.replace(/^<svg[^>]*>/, '').replace('</svg>', '')}
  </svg>`;
  const blob = new Blob([wrapped], {type: 'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = 1080; c.height = 1920;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      c.toBlob(b => res(b), 'image/png');
    };
    img.onerror = rej;
    img.src = url;
  });
}

async function downloadAll() {
  const btn = document.getElementById('btn');
  const status = document.getElementById('status');
  const previews = document.getElementById('previews');
  btn.disabled = true;
  status.textContent = 'Fetching deck…';
  try {
    const svgs = await getSVGs();
    status.textContent = `Rendering ${svgs.length} slides…`;
    const zip = new JSZip();
    previews.innerHTML = '';
    for (let i = 0; i < svgs.length; i++) {
      status.textContent = `Rendering slide ${i+1}/${svgs.length}…`;
      const blob = await svgToPng(svgs[i]);
      const label = SLIDE_LABELS[i] || (\`0${i+1}-slide\`);
      zip.file(`${label}.png`, blob);
      // thumb preview
      const div = document.createElement('div');
      div.className = 'thumb';
      const img = document.createElement('img');
      img.src = URL.createObjectURL(blob);
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;';
      div.appendChild(img);
      previews.appendChild(div);
    }
    status.textContent = 'Zipping…';
    const zipBlob = await zip.generateAsync({type:'blob'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(zipBlob);
    a.download = 'haps-club-testimonial-reel.zip';
    a.click();
    status.textContent = 'Done. Check your downloads.';
  } catch(e) {
    status.textContent = 'Error: ' + e.message;
    console.error(e);
  }
  btn.disabled = false;
}
</script>
</body>
</html>
